daemon = false
log = stdout
loglevel = warn
ipv4 = true
ipv6 = false
bandwidth = O
notransit = true

[sam]
enabled = true
address = 127.0.0.1
# TCP/UDP ports are assigned by the supervisor, never user-installed I2P.

[http]
enabled = false
[httpproxy]
enabled = false
[socksproxy]
enabled = false
[bob]
enabled = false
[i2cp]
enabled = false
[i2pcontrol]
enabled = false
[upnp]
enabled = false
[reseed]
verify = true
# Debian's pinned router predates changes to some default reseed hosts.
# This HTTPS endpoint serves signed SU3; its signer is in the bundled cert set.
urls = https://reseed.diva.exchange/
